<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediksi Risiko — AgroSense</title>
  <style>
    :root {
      --primary: #15803d;
      --primary-dark: #166534;
      --bg: #f0fdf4;
      --text: #1a2e1a;
      --muted: #5b7a5e;
      --card: #ffffff;
      --border: #d1e7d4;
      --success: #15803d;
      --danger: #dc2626;
      --warn: #d97706;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      width: 100%;
      padding: 1.5rem;
      text-align: center;
    }
    header a { color: #fff; opacity: 0.9; font-size: 0.9rem; text-decoration: none; }
    main { flex: 1; max-width: 480px; width: 100%; padding: 2rem 1.5rem; }
    form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: grid;
      gap: 1rem;
    }
    label { font-weight: 600; font-size: 0.9rem; display: grid; gap: 0.4rem; }
    input {
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
    }
    input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #result {
      margin-top: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 1.05rem;
      display: none;
    }
    #result.error { color: var(--danger); }
    #result.success { color: var(--success); font-size: 2rem; text-align: center; }
    #result.high-risk { color: var(--danger); font-size: 2rem; text-align: center; }
    .note { font-size: 0.85rem; color: var(--muted); margin-top: 1rem; }
    .back { display: inline-block; margin-top: 1rem; color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>Prediksi Risiko Gagal Panen</h1>
    <a href="/">&larr; Kembali ke Beranda</a>
  </header>
  <main>
    <form id="form">
      <label for="farm_id">Farm ID
        <input type="text" id="farm_id" placeholder="contoh: F00001" required>
      </label>
      <label for="crop_id">Crop ID
        <input type="text" id="crop_id" placeholder="contoh: C00001" required>
      </label>
      <button type="submit" id="submit-btn">Cek Risiko</button>
    </form>
    <div id="result"></div>
    <p class="note">POST /api/predict-risk → diteruskan ke Lambda Risk Prediction via API Gateway (header x-api-key di-inject server). Risiko &gt; 70% memicu metric HighRiskFarmCount di CloudWatch.</p>
    <a class="back" href="/">&larr; Beranda</a>
  </main>

  <script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const farm_id = document.getElementById('farm_id').value.trim();
      const crop_id = document.getElementById('crop_id').value.trim();

      result.style.display = 'block';
      result.className = '';
      result.textContent = 'Memproses...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/predict-risk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ farm_id, crop_id })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || data.error || 'Terjadi kesalahan');
        }

        const pct = data.risk_percentage;
        result.textContent = pct + '%';
        // Tandai risiko tinggi (>70) dengan warna merah.
        result.className = (typeof pct === 'number' && pct > 70) ? 'high-risk' : 'success';
      } catch (err) {
        result.className = 'error';
        result.textContent = 'Error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
