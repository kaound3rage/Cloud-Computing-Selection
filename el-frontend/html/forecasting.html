<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yield Forecasting — AgroSense</title>
  <style>
    :root {
      --primary: #15803d;
      --primary-dark: #166534;
      --bg: #f0fdf4;
      --text: #1a2e1a;
      --muted: #5b7a5e;
      --card: #ffffff;
      --border: #d1e7d4;
      --danger: #dc2626;
      --line: #d1e7d4;
      --bar: #16a34a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      width: 100%;
      padding: 1.5rem;
      text-align: center;
    }
    header a { color: #fff; opacity: 0.9; font-size: 0.9rem; text-decoration: none; }
    main { flex: 1; max-width: 720px; width: 100%; padding: 2rem 1.5rem; }
    form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: end;
    }
    label { font-weight: 600; font-size: 0.85rem; display: grid; gap: 0.4rem; }
    input {
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
    }
    input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #result { margin-top: 1.5rem; display: none; }
    #error { color: var(--danger); font-weight: 600; margin-top: 1rem; display: none; }
    .chart-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .chart { display: flex; align-items: flex-end; gap: 4px; height: 240px; border-bottom: 1px solid var(--line); }
    .bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; text-align: center; }
    .bar { background: var(--bar); border-radius: 3px 3px 0 0; min-height: 2px; }
    .bar-label { font-size: 0.65rem; color: var(--muted); margin-top: 0.3rem; white-space: nowrap; }
    .summary { display: flex; justify-content: space-between; margin-top: 1rem; font-weight: 600; flex-wrap: wrap; gap: 0.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 0.5rem; text-align: left; }
    th { background: var(--bg); }
    .note { font-size: 0.85rem; color: var(--muted); margin-top: 1rem; }
    .back { display: inline-block; margin-top: 1rem; color: var(--primary); text-decoration: none; font-weight: 600; }
    @media (max-width: 560px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Forecasting Hasil Panen</h1>
    <a href="/">&larr; Kembali ke Beranda</a>
  </header>
  <main>
    <form id="form">
      <label for="crop_id">Crop ID
        <input type="text" id="crop_id" placeholder="contoh: C00001" required>
      </label>
      <button type="submit" id="submit-btn">Lihat Forecast</button>
    </form>
    <div id="error"></div>
    <div id="result" class="chart-wrap"></div>
    <p class="note">GET /api/yield-forecast/{crop_id} → dibaca <strong>langsung dari DynamoDB</strong> (YIELD_HISTORY_TABLE) oleh frontend, bukan via API Gateway.</p>
    <a class="back" href="/">&larr; Beranda</a>
  </main>

  <script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const crop_id = document.getElementById('crop_id').value.trim();
      errorBox.style.display = 'none';
      result.style.display = 'block';
      result.innerHTML = '<p>Memproses...</p>';
      submitBtn.disabled = true;

      try {
        // Endpoint langsung DynamoDB: GET dengan crop_id di path.
        const res = await fetch('/api/yield-forecast/' + encodeURIComponent(crop_id), {
          method: 'GET'
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || data.error || 'Terjadi kesalahan');
        }

        renderForecast(data.forecasts || data.forecast || [], data.crop_id);
      } catch (err) {
        result.style.display = 'none';
        errorBox.textContent = 'Error: ' + err.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });

    function qtyOf(item) {
      // Dukung beberapa nama field: forecast_quantity_ton (Lambda) / predicted_*.
      const v = item.forecast_quantity_ton ?? item.predicted_quantity_ton
        ?? item.predicted_enrollments ?? item.quantity_ton ?? 0;
      return Number(v) || 0;
    }

    function periodOf(item) {
      return item.forecast_period ?? item.date ?? item.generated_at ?? '-';
    }

    function renderForecast(forecasts, cropId) {
      if (!Array.isArray(forecasts) || forecasts.length === 0) {
        result.innerHTML = '<p>Tidak ada data forecast untuk crop ini.</p>';
        return;
      }

      const maxVal = Math.max(...forecasts.map(qtyOf), 1);
      let html = '<div class="chart">';
      for (const item of forecasts) {
        const qty = qtyOf(item);
        const period = periodOf(item);
        const height = Math.max((qty / maxVal) * 100, 2);
        const label = String(period).slice(5, 10) || String(period);
        html += `<div class="bar-col">
                   <div class="bar" style="height:${height}%" title="${qty} ton (${period})"></div>
                   <div class="bar-label">${label}</div>
                 </div>`;
      }
      html += '</div>';
      const total = forecasts.reduce((s, f) => s + qtyOf(f), 0);
      html += `<div class="summary">
                 <span>Crop: ${cropId}</span>
                 <span>Item: ${forecasts.length}</span>
                 <span>Total: ${total.toFixed(2)} ton</span>
                 <span>Avg: ${(total / forecasts.length).toFixed(2)} ton</span>
               </div>`;
      html += '<table><thead><tr><th>Periode</th><th>Qty (ton)</th><th>Generated At</th></tr></thead><tbody>';
      for (const item of forecasts) {
        html += `<tr><td>${periodOf(item)}</td><td>${qtyOf(item)}</td><td>${item.generated_at ?? '-'}</td></tr>`;
      }
      html += '</tbody></table>';
      result.innerHTML = html;
    }
  </script>
</body>
</html>
