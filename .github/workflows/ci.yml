name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (lowercase, required by GHCR)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set version
        run: echo "VERSION=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV

      - name: Build Go binary
        working-directory: el-frontend
        run: |
          go mod download
          go vet ./...
          go build -o /dev/null ./...
          go build -o el-frontend ./...

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./el-frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-latest

  build-example-dataset-csv:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r dataset/requirements.txt

      - name: Generate dataset
        run: python dataset/dataset.py --output dataset/output

      - name: Compose raw-data structure
        run: |
          mkdir -p raw-data/farm-profiles \
                   raw-data/crop-catalog \
                   raw-data/farm-activities \
                   raw-data/harvest-history
          cp dataset/output/farm_profiles.csv raw-data/farm-profiles/
          cp dataset/output/crop_catalog.csv raw-data/crop-catalog/
          cp dataset/output/farm_activities.csv raw-data/farm-activities/
          cp dataset/output/harvest_history.csv raw-data/harvest-history/
          zip -r raw-data.zip raw-data/

      - name: Upload dataset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dataset"
          files: |
            raw-data.zip
            dataset/output/farm_profiles.csv
            dataset/output/crop_catalog.csv
            dataset/output/farm_activities.csv
            dataset/output/harvest_history.csv
